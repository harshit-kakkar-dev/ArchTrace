name: ArchTrace PR Decision Guardian

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  check-historical-decisions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with full git history (for rename tracking)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Seed institutional memory from public discussion
        env:
          PYTHONPATH: src
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          python -c "from archtrace.db import init_db; from archtrace.benchmarks import SAMPLE_PEP_BENCHMARKS; from archtrace.extractor import extract_decisions_from_posts; init_db(); b=SAMPLE_PEP_BENCHMARKS['PEP 678 – Enriching Exceptions with Notes (Discourse #12641)']; extract_decisions_from_posts(b['discourse_url'], b['synthetic_discussion_posts'], api_key='${LLM_API_KEY}', target_files=['src/archtrace/extractor.py'])"

      - name: Run ArchTrace PR Memory Bot
        env:
          PYTHONPATH: src
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python -m archtrace.pr_bot